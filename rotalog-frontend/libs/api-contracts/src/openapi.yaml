openapi: 3.0.0
info:
  title: RotaLog API
  version: 1.0.0
  description: API de logística e entregas
  # TODO: Versão desatualizada há 2 anos

servers:
  - url: http://localhost:8080
    description: API Frotas (Java)
  - url: http://localhost:3000
    description: API Entregas (Node)
  - url: http://localhost:5000
    description: API Notificações (.NET)

paths:
  /api/veiculos:
    get:
      summary: Listar veículos
      tags:
        - Veículos
      responses:
        '200':
          description: Lista de veículos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Veiculo'
    post:
      summary: Criar veículo
      tags:
        - Veículos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeiculoInput'
      responses:
        '201':
          description: Veículo criado

  /api/entregas:
    get:
      summary: Listar entregas
      tags:
        - Entregas
      responses:
        '200':
          description: Lista de entregas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entrega'

  /api/alertas-manutencao:
    get:
      summary: Listar alertas de manutenção preventiva
      tags:
        - Alertas de manutenção
      parameters:
        - name: status
          in: query
          required: false
          description: Filtro de status (sem diferenciar maiúsculas de minúsculas)
          schema:
            type: string
            enum: [PENDENTE, ENVIADO, FALHA]
      responses:
        '200':
          description: Lista ordenada por dataCriacao decrescente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertaManutencao'
        '400':
          description: Status inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string

  /api/alertas-manutencao/verificar:
    post:
      summary: Verificar veículos e gerar alertas de manutenção preventiva
      tags:
        - Alertas de manutenção
      responses:
        '200':
          description: Verificação executada (inclusive se api-notificacoes estiver fora do ar)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacaoAlertas'
        '500':
          description: Erro interno

  # TODO: Endpoints que não existem mais
  /api/rastreamento/real-time:
    get:
      summary: Rastreamento em tempo real (DESCONTINUADO)
      deprecated: true
      tags:
        - Rastreamento
      responses:
        '200':
          description: Dados de rastreamento

  # TODO: Endpoints faltando
  # /api/notificacoes
  # /api/manutencao
  # /api/motoristas/{id}/disponibilidade

components:
  schemas:
    Veiculo:
      type: object
      properties:
        id:
          type: integer
        placa:
          type: string
        modelo:
          type: string
        # TODO: Campo desatualizado - backend usa data_cadastro
        dataCadastro:
          type: string
          format: date-time
        status:
          type: string
          enum: [ativo, inativo, manutencao]
        quilometragem:
          type: number

    AlertaManutencao:
      type: object
      properties:
        id:
          type: integer
        veiculoId:
          type: integer
        placa:
          type: string
        modelo:
          type: string
          nullable: true
        motivo:
          type: string
          enum: [QUILOMETRAGEM, TEMPO, AMBOS]
        quilometragemAtual:
          type: integer
          nullable: true
        limiteQuilometragem:
          type: integer
          nullable: true
        dataUltimaManutencao:
          type: string
          format: date
          nullable: true
        mesesDesdeUltimaManutencao:
          type: integer
          nullable: true
        mesesLimite:
          type: integer
          nullable: true
        status:
          type: string
          enum: [PENDENTE, ENVIADO, FALHA]
        notificacaoId:
          type: integer
          nullable: true
        destinatario:
          type: string
          nullable: true
        erroMensagem:
          type: string
          nullable: true
        tentativas:
          type: integer
        dataCriacao:
          type: string
          format: date-time
        dataEnvio:
          type: string
          format: date-time
          nullable: true
        dataAtualizacao:
          type: string
          format: date-time

    VerificacaoAlertas:
      type: object
      properties:
        veiculosVerificados:
          type: integer
        criados:
          type: integer
        enviados:
          type: integer
        pendentes:
          type: integer
        falhas:
          type: integer
        reenviados:
          type: integer
        ignoradosPorDuplicidade:
          type: integer
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/AlertaManutencao'

    VeiculoInput:
      type: object
      required:
        - placa
        - modelo
      properties:
        placa:
          type: string
        modelo:
          type: string
        ano:
          type: integer

    Entrega:
      type: object
      properties:
        id:
          type: integer
        numero_pedido:
          type: string
        status:
          type: string
          enum: [pendente, em_transito, entregue, cancelada]
        driver_name:
          type: string
        destination_address:
          type: string
        distance_km:
          type: number
        estimated_time_minutes:
          type: integer
        progress_percentage:
          type: number
